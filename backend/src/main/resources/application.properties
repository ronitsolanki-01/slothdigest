spring.application.name=slothdigest
server.port=8080
# Lets the React app show messages like "Username already taken"
server.error.include-message=always

# --- Database (file-based H2, no setup needed). Swap for Postgres in production. ---
spring.datasource.url=jdbc:h2:file:./data/slothdigest
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Uploads ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Spring AI 2.x + Ollama (open-weight model running locally) ---
# Models are NOT auto-pulled. Run first:  ollama pull qwen3.5:4b
spring.ai.ollama.chat.model=qwen3.5:4b
spring.ai.ollama.chat.num-ctx=8192
spring.ai.ollama.chat.temperature=0.2
# Thinking is switched off in code (see DigestAi.java), which works on every 2.x release.
# You can also try the property form: spring.ai.ollama.chat.think=false
# (not used by SlothDigest yet, kept for later RAG/search features)
spring.ai.ollama.embedding.options.model=nomic-embed-text

# --- Spring Security / JWT ---
# Override with the JWT_SECRET env var. Must be at least 32 characters.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-something-long-and-random}
app.jwt.expiration-minutes=1440

# --- Overnight digest job ---
# Spring cron: second minute hour day month weekday  (default: every day at 03:00)
app.digest.cron=0 0 3 * * *
# Max characters of a chat sent to the model (the most recent part is kept)
app.digest.max-chars=12000
